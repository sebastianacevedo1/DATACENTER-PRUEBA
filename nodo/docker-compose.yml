name: nodos

services:
  nodo_a:
    build: .
    image: nexus-nodo
    container_name: nodo_a
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
    environment:
      NAT_TYPE: ${NODO_A_TIPO:-static}
      OUT_PREFIX: "172.28.1."
      IN_PREFIX: "172.30.1."
      CLIENT_IP: "172.30.1.10"
    networks:
      fuera_a: { ipv4_address: 172.28.1.2 }
      dentro_a: { ipv4_address: 172.30.1.2 }

  cliente_a:
    build: { context: ., dockerfile: Dockerfile.cliente }
    container_name: cliente_a
    cap_add: [NET_ADMIN]
    environment:
      GW: 172.30.1.2
    depends_on: [nodo_a]
    networks:
      dentro_a: { ipv4_address: 172.30.1.10 }

  nodo_b:
    build: .
    image: nexus-nodo
    container_name: nodo_b
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: 1
    environment:
      NAT_TYPE: ${NODO_B_TIPO:-dynamic}
      OUT_PREFIX: "172.28.2."
      IN_PREFIX: "172.30.2."
      CLIENT_IP: "172.30.2.10"
    networks:
      fuera_b: { ipv4_address: 172.28.2.2 }
      dentro_b: { ipv4_address: 172.30.2.2 }

  cliente_b:
    build: { context: ., dockerfile: Dockerfile.cliente }
    container_name: cliente_b
    cap_add: [NET_ADMIN]
    environment:
      GW: 172.30.2.2
    depends_on: [nodo_b]
    networks:
      dentro_b: { ipv4_address: 172.30.2.10 }

networks:
  fuera_a:
    ipam: { config: [{ subnet: 172.28.1.0/24 }] }
  fuera_b:
    ipam: { config: [{ subnet: 172.28.2.0/24 }] }
  dentro_a:
    ipam: { config: [{ subnet: 172.30.1.0/24 }] }
  dentro_b:
    ipam: { config: [{ subnet: 172.30.2.0/24 }] }